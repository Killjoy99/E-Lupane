[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3"], optional= true }
time = { version = "0.3.51", features = ["formatting", "macros", "parsing"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }

[features]
# Allow the binary crate to initialize logging
init = []
python = ["pyo3"]

[lib]
# name = "entweni_logger" When I want to change the module name without changing the actual folder name.
crate-type = ["cdylib", "rlib"]