[workspace]
resolver = "2"

# The Dioxus frontend is a standalone WASM web crate.
# It is excluded from the native Rust workspace because it only builds for the
# wasm32-unknown-unknown target via the Dioxus CLI (`dx build` / `dx serve`).
# It lives in `plugins/frontend` (a Dioxus 0.7 fullstack app).
exclude = ["frontend", "plugins/frontend"]

members = [

    "crates/elupane_core",
    "crates/kernel",
    "crates/plugin_manager",
    "crates/event_bus",
    "crates/config",
    "crates/permissions",
    "crates/database",
    "crates/storage",
    "crates/gateway",
    "crates/common",
    "crates/installer",
    "crates/messaging_core",

    "crates/sdk/rust_sdk",
    "crates/sdk/python_sdk",

    "plugins/institution_management",
    "plugins/course_management",
    "plugins/assignments",
    "plugins/quizzes",
    "plugins/analytics",
    "plugins/notifications",

    "plugins/academics",
    "plugins/ai",
    "plugins/attendance",
    "plugins/auth",
    "plugins/audit",
    "plugins/certificates",
    "plugins/content",
    "plugins/enrollments",
    "plugins/exams",
    "plugins/gamification",
    "plugins/grades",
    "plugins/learning_progress",
    "plugins/learning_paths",
    "plugins/live_classes",
    "plugins/media",
    "plugins/messaging",
    "plugins/payments",
    "plugins/search",
    "plugins/settings",

    "services/media_service",
    "services/search_service",
    "services/notification_service", "crates/cache",
    "plugins/support",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
toml = "1.1.2"
dotenvy = "0.15.7"

redis = { version = "1.3.0", features = ["tokio-comp", "streams"] }
futures-util = "0.3"
jsonwebtoken = "9"
bcrypt = "0.15"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

actix-web = "4"
sqlx = { version = "0.9.0", features = ["chrono", "migrate", "postgres", "runtime-tokio", "uuid"] }
