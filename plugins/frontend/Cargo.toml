[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["fullstack"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"

# Server-only dependencies: SQLx (PostgreSQL) and dotenvy. These cannot be
# compiled to WASM, so they are optional and only enabled by the `server`
# feature (the server side of the fullstack build).
sqlx = { version = "0.9", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
dotenvy = { version = "0.15", optional = true }

[features]
# `web` targets the WASM client, `server` targets the native fullstack server
# (Axum + SQLx). `dx` enables the right one automatically per platform.
default = []
server = ["dioxus/server", "dep:sqlx", "dep:dotenvy"]
web = ["dioxus/web"]

