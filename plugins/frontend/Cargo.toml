[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

# This crate is a standalone Dioxus app: it is excluded from the parent
# E-Lupane workspace (root Cargo.toml `exclude`) and declares its own empty
# workspace so Cargo treats it as fully independent. It only builds via the
# Dioxus CLI (`dx build` / `dx serve`) for the wasm32-unknown-unknown target.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["fullstack"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["serde", "v4", "js"] }
chrono = { version = "0.4", features = ["serde"] }

# Server-only dependencies: SQLx (PostgreSQL) and dotenvy. These cannot be
# compiled to WASM, so they are optional and only enabled by the `server`
# feature (the server side of the fullstack build).
sqlx = { version = "0.9", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
dotenvy = { version = "0.15", optional = true }

# Server-only bridge to the plugin system: request/response RPC with the auth
# plugin over the Redis messaging layer (shared crates, referenced by path).
cache = { path = "../../crates/cache", optional = true }
messaging_core = { path = "../../crates/messaging_core", optional = true }

# Server-only: the live-session WebSocket signaling relay (video/chat/whiteboard).
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "sync"] }
futures-util = { version = "0.3", optional = true }

# Server-only: Google OAuth token exchange + userinfo fetch.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# Server-only: mint auth-plugin-compatible admin JWTs for Google admins
# (HS256, same AUTH_JWT_SECRET the auth plugin validates with).
jsonwebtoken = { version = "9", optional = true }

[features]
# `web` targets the WASM client, `server` targets the native fullstack server
# (Axum + SQLx). `dx` enables the right one automatically per platform.
default = []
server = ["dioxus/server", "dep:sqlx", "dep:dotenvy", "dep:cache", "dep:messaging_core", "dep:tokio", "dep:futures-util", "dep:reqwest", "dep:jsonwebtoken"]
web = ["dioxus/web"]

