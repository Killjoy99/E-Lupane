id = "com.elupane.course_management"
name = "Course Management"
version = "1.0.0"
authors = [
  "Philani Dlamini"
]
description = "Course management module: courses, instructors, statuses, publishing, duplication"
runtime = "process"
language = "rust"
entry = "target/debug/course_management"
ui = "/ui"
api = "/api"
minimum_core_version = "1.0.0"
capabilities = [
  "courses.read",
  "courses.write",
  "courses.publish",
  "courses.delete",
  "courses.duplicate",
  "courses.preview",
  "events.subscribe"
]
dependencies = ["com.elupane.auth"]
